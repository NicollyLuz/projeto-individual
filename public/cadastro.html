<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fashion Lux | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">Fashion Lux</h1>
      <ul class="navbar">
        <li><a href="index.html">Tendências</a></li>
        <li><a href="editorial.html">Editorial</a></li>
        <li>|</li>
        <li><a href="login.html">Login</a></li>
        <li class="agora"><a href="#">Cadastro</a></li>
        <a href="quiz.html" style="color: #5c1324; font-weight: bold;">Quiz</a>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <!-- Div onde as mensagens de erro/sucesso aparecem -->
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="Seu email" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <!-- minlength="8": atributo HTML que exige no mínimo 8 caracteres (camada extra de UX) -->
            <input id="senha_input" type="password" placeholder="******" minlength="8" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <!-- minlength="8": mesma regra aplicada ao campo de confirmação -->
            <input id="confirmacao_senha_input" type="password" placeholder="******" minlength="8" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>© 2026 FASHION LUX</h4>
    </div>
  </div>
  <!--footer fim-->
</body>
</html>

<script>
  // ============================================================
  // FUNÇÃO cadastrar()
  // Executada quando o usuário clica no botão "Cadastrar".
  // Responsável por validar os campos e enviar os dados ao backend.
  // ============================================================
  function cadastrar() {

    // ---------- 1. CAPTURA DOS VALORES DOS INPUTS ----------
    // Cada variável recebe o que o usuário digitou no respectivo campo.
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // ---------- 2. VETOR (array) COM OS CAMPOS ----------
    // Criamos um array de objetos para facilitar a validação em loop.
    // Cada posição guarda: o valor digitado + o nome amigável do campo.
    // Vantagem: se um campo estiver vazio, conseguimos dizer QUAL faltou.
    var campos = [
      { valor: nomeVar,             nome: "Nome" },
      { valor: emailVar,            nome: "E-mail" },
      { valor: senhaVar,            nome: "Senha" },
      { valor: confirmacaoSenhaVar, nome: "Confirmação de Senha" }
    ];

    // ---------- 3. FOR PERCORRENDO O VETOR ----------
    // Percorre todos os campos do array (índice 0 até length-1).
    // Se algum estiver vazio (""), exibe mensagem de erro e para a função.
    for (var i = 0; i < campos.length; i++) {
      if (campos[i].valor == "") {
        cardErro.style.display = "block";                                 // mostra o card de erro
        mensagem_erro.innerHTML = "Por favor, preencha o campo: " + campos[i].nome; // mensagem dinâmica
        return false;                                                     // interrompe o cadastro
      }
    }

    // ---------- 4. AGENDAMENTO PARA ESCONDER A MENSAGEM ----------
    // Se tudo passou, agenda para esconder o card de erro após 5 segundos.
    setInterval(sumirMensagem, 5000);

    // ---------- 5. VALIDAÇÃO DE TAMANHO DA SENHA ----------
    // .length retorna quantos caracteres a string tem.
    // Se for menor que 8, bloqueia o cadastro.
    if (senhaVar.length < 8) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha deve ter no mínimo 8 caracteres!";
      return false;
    }

    // ---------- 6. VALIDAÇÃO DE CONFIRMAÇÃO DE SENHA ----------
    // Compara os dois campos. Se forem diferentes, exibe erro.
    if (senhaVar !== confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem!";
      return false;
    }

    // Log no console para facilitar debug durante o desenvolvimento.
    console.log("Tentando cadastrar:", nomeVar, emailVar);

    // ---------- 7. ENVIO PARA O BACKEND (FETCH) ----------
    // Faz uma requisição HTTP POST para a API enviando os dados em JSON.
    fetch("http://localhost:3333/usuario/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json", // avisa o servidor que o corpo é JSON
      },
      body: JSON.stringify({
        // O backend espera os nomes "nomeServer", "emailServer" e "senhaServer"
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      // ---------- 8. TRATAMENTO DA RESPOSTA ----------
      .then(function (resposta) {
        if (resposta.ok) {
          // Status HTTP 2xx → cadastro deu certo
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para o Login...";

          // Espera 2 segundos e redireciona para a tela de login
          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          // Se tiver a função limparFormulario no sessao.js, descomente abaixo
          // limparFormulario();
        } else {
          // Status HTTP diferente de 2xx → erro no servidor (ex: email duplicado)
          resposta.text().then(texto => {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Erro: " + texto;
          });
        }
      })
      // ---------- 9. TRATAMENTO DE ERRO DE CONEXÃO ----------
      .catch(function (erro) {
        // Cai aqui se o servidor estiver desligado, rota errada, sem internet, etc.
        console.log(`#ERRO: ${erro}`);
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Erro ao conectar com o servidor. Ele está rodando?";
      });

    // return false impede o recarregamento padrão (caso vire um form no futuro)
    return false;
  }

  // ============================================================
  // FUNÇÃO sumirMensagem()
  // Esconde o card de erro. Chamada automaticamente após 5s.
  // ============================================================
  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
</html>
