<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashion Lux | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <!--Header-->
    <div class="header">
        <div class="container">
            <h1 class="titulo">Fashion Lux</h1>
            <ul class="navbar">
                <li><a href="index.html">Tendências</a></li>
                <li><a href="editorial.html">Editorial</a></li>
                <li>|</li>
                <li class="agora"><a href="#">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <a href="quiz.html" style="color: #5c1324; font-weight: bold;">Quiz</a>
            </ul>
        </div>
    </div>

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h2>Olá de volta!</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>

    <!--footer inicio-->
    <div class="footer">
        <div class="container">
            <h4>© 2026 FASHION LUX</h4>
        </div>
    </div>
    <!--footer fim-->

</body>
</html>

<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Por favor, preencha todos os campos!";
            return false;
        } else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("Tentando login com:", emailVar);

        fetch("http://localhost:3333/usuario/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log("Usuário autenticado:", json);

                    // --- CORREÇÃO AQUI ---
                    // 1. Salva no sessionStorage (padrão antigo do seu projeto)
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    // 2. Salva no localStorage (é o que a Dashboard e o Quiz estão lendo!)
                    localStorage.setItem('nomeUsuario', json.nome);
                    localStorage.setItem('idUsuario', json.id);

                    setTimeout(function () {
                        window.location = "dashboard.html"; 
                    }, 1000); 
                });
            } else {
                resposta.text().then(texto => {
                    console.error(texto);
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = "E-mail ou senha incorretos.";
                });
            }
        }).catch(function (erro) {
            console.log("Erro de conexão:", erro);
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Erro ao conectar com o servidor. Ele está rodando?";
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
</html>
