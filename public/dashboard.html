<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Lux - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... (MANTENHA O SEU CSS EXATAMENTE COMO ESTAVA AQUI) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #fcf5f5; color: #333; }
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #5c1324; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 400; margin-bottom: 5px; }
        .greeting { font-size: 0.8rem; color: #d1a9b1; margin-bottom: 30px; }
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-item { text-decoration: none; color: white; padding: 12px 15px; border-radius: 5px; font-size: 0.9rem; transition: 0.3s; }
        .nav-item:hover { background-color: #7a1c32; }
        .nav-item.active { background-color: #a63d55; font-weight: 600; }
        .btn-logout { margin: 0; padding: 10px 15px; width: 100%; background-color: transparent; color: white; border: 1px solid #a63d55; border-radius: 5px; text-align: center; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .btn-logout:hover { background-color: #a63d55; }
        .main-content { flex: 1; padding: 40px; }
        .header { margin-bottom: 30px; }
        .subtitle { font-size: 0.75rem; letter-spacing: 2px; color: #888; font-weight: 600; }
        .header h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: #5c1324; font-weight: 400; margin-top: 5px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #f0e6e6; }
        .kpi-card h3 { font-size: 0.7rem; color: #888; letter-spacing: 1px; margin-bottom: 15px; font-weight: 600; }
        .kpi-value { font-family: 'Playfair Display', serif; font-size: 2rem; color: #333; margin-bottom: 5px; }
        .kpi-desc { font-size: 0.75rem; color: #999; }
        .progress-bar { width: 100%; height: 6px; background-color: #f0e6e6; border-radius: 3px; margin-top: 10px; }
        .progress-fill { height: 100%; background-color: #5c1324; border-radius: 3px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .chart-card { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #f0e6e6; }
        .chart-card h3 { font-size: 1rem; color: #333; margin-bottom: 20px; font-weight: 400; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-top">
                <h1 class="logo">Fashion Lux</h1>
                <!-- Nome do usuário dinâmico -->
                <p class="greeting" id="nomeUsuario">Olá, visitante!</p>
                <nav class="nav-menu">
                    <a href="#" class="nav-item active">Visão geral</a>
                    <a href="quiz.html" class="nav-item">Fazer o Quiz</a>
                </nav>
            </div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </aside>

        <main class="main-content">
            <header class="header">
                <span class="subtitle">PAINEL DA REVISTA</span>
                <h2>Qual é o estilo dos nossos leitores?</h2>
            </header>

            <section class="kpi-grid">
                <div class="kpi-card">
                    <h3>FIZERAM O QUIZ</h3>
                    <!-- Adicionado ID para o JS atualizar -->
                    <p class="kpi-value" id="kpiTotalQuizzes">0</p>
                    <span class="kpi-desc">pessoas no total</span>
                </div>
                <div class="kpi-card">
                    <h3>ESTILO MAIS VOTADO</h3>
                    <p class="kpi-value" id="kpiEstiloMaisVotado">-</p>
                    <span class="kpi-desc" id="kpiEstiloDesc">-</span>
                </div>
                <div class="kpi-card">
                    <h3>CADASTRADOS NO SITE</h3>
                    <!-- Adicionado ID para o JS atualizar -->
                    <p class="kpi-value" id="kpiTotalUsuarios">0</p>
                    <span class="kpi-desc">usuários cadastrados</span>
                </div>
                <div class="kpi-card">
                    <h3>CADASTRADOS QUE FIZERAM O QUIZ</h3>
                    <p class="kpi-value" id="kpiPorcentagem">0%</p>
                    <div class="progress-bar"><div class="progress-fill" id="barraProgresso" style="width: 0%;"></div></div>
                </div>
            </section>

            <section class="charts-grid">
                <div class="chart-card">
                    <h3>Pessoas por estilo</h3>
                    <div class="chart-container">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>Quizzes feitos por dia</h3>
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Importa o arquivo JS separado -->
    <script src="dashboard.js"></script>
</body>
</html>
